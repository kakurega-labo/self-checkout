// ---- simulation ----
function spring(v,vel,tg,k,z,dt){vel+=(-k*(v-tg)-2*z*Math.sqrt(k)*vel)*dt;return[v+vel*dt,vel]}
function judge(it){const g=it.ct<T.perfect?0:it.ct<T.good?1:2,names=['PERFECT!','GOOD','OK'];

 if(g<2){const s=SC[combo%8];ping(pf(s),.34);if(combo%8===7){[0,4,7,12].forEach((q,i)=>ping(pf(q+12),.22,.1,.05*i+.1));trauma=Math.min(1,trauma+.6);hs=.09;slowT=slowD=.22;flash=.6;burst(W/2,300,24,260,-Math.PI/2,2.4)}combo++;if(combo>maxC)maxC=combo}
 else ping(pf(SC[combo%8]),.3);
 if(g===0){perf++;sfx.bash();trauma=Math.min(1,trauma+.3);hs=Math.max(hs,.07);slowT=slowD=.16;punchV=.5;flash=Math.max(flash,.35)}
 else if(g===1){hs=Math.max(hs,.035);flash=Math.max(flash,.18)}else flash=Math.max(flash,.08);
 burst(it.x,LY,g===0?14:10,200,-Math.PI/2,Math.PI*1.4);label={s:names[g],t:0,c:g===0?'#ffd84a':g===1?'#fff':'#9fb2c4'}}
function step(dt){if(timeLeft>0){timeLeft-=dt;if(timeLeft<=0)finish()}if(combo>0&&clock-lastScan>3){combo=0;sfx.bu()}
 for(let n=spawnT.length-1;n>=0;n--){spawnT[n]-=dt;if(spawnT[n]<=0){spawnT.splice(n,1);spawn((count+items.length)%5)}}
 for(let k=items.length-1;k>=0;k--){const it=items[k],ty=it.ty;
  if(it.fly){it.fly+=dt;const u=Math.min(it.fly/.36,1),e=eOC(u);it.x=lerp(it.sx,BAG.x,e);it.y=lerp(it.sy,BAG.y,e);it.a+=it.w*dt*(1-u);it.h=Math.sin(u*Math.PI)*.9;
   if(u>=1){items.splice(k,1);count++;total+=ty.price;totBump=.35;bagV+=2.2;sfx.pof();trauma=Math.min(1,trauma+.05);spawnT.push(.35);burst(BAG.x,BAG.y,5,90,-Math.PI/2,2)}continue}
  let r=spring(it.h,it.hv,it.held?1:0,260,.5,dt);const ph=it.h;it.h=r[0];it.hv=r[1];if(ph>.15&&it.h<=.15&&it.hv<0){sfx.put(ty.m);trauma=Math.min(1,trauma+.05)}
  r=spring(it.fl,it.fv,it.ft||0,300,.6,dt);it.fl=r[0];it.fv=r[1];
  if(it.held&&ptr){const tx=ptr.x,tyy=ptr.y-T.offset;let q=spring(it.x,it.vx,tx,ty.k,ty.z,dt);it.x=q[0];it.vx=q[1];q=spring(it.y,it.vy,tyy,ty.k,ty.z,dt);it.y=q[0];it.vy=q[1];if(it.r){const c=Math.cos(it.a),s=Math.sin(it.a),rx=it.r[0]*c-it.r[1]*s,ry=it.r[0]*s+it.r[1]*c;it.w=clamp(it.w+(rx*(tyy-it.y)-ry*(tx-it.x))*.02*dt,-12,12)}}
  else{it.x+=it.vx*dt;it.y+=it.vy*dt;const f=Math.exp(-6*dt);it.vx*=f;it.vy*=f;if(it.y<228&&!it.held)it.vy+=(250-it.y)*30*dt;it.x=clamp(it.x,34,326);if(it.y>620)it.y=620}
  it.a+=it.w*dt;it.w*=Math.exp(-(it.held?3.5:2)*dt);
  const da=it.a-Math.PI*Math.round(it.a/Math.PI);if(Math.abs(it.w)<1.3&&Math.abs(da)<.3)it.a-=da*(1-Math.exp(-14*dt));
  // scan
  if(it.held&&!it.sc&&it.fl>.85){const sc=1+.12*it.h,c=Math.cos(it.a),s=Math.sin(it.a),b=ty.bc,bx=it.x+(b.x*c-b.y*s)*sc,by=it.y+(b.x*s+b.y*c)*sc;
   const d=Math.abs(da),zr=T.zone*Math.PI/180*ty.tol,fr=T.fall*Math.PI/180*ty.tol,A=d<zr?1:1-ss(zr,fr,d),dy=Math.abs(by-LY),hh=b.h/2*sc+18,C=dy<hh&&bx>24&&bx<336?1-.5*(dy/hh)*(dy/hh):0,rate=T.rate*A*C;
   if(rate>.05){it.P+=rate*dt;it.ct+=dt;it.miss=0;it.tried+=dt;it.near=false;it.bt-=dt;if(it.bt<=0){ping(pf(it.P*3)*.7,.07,.04);it.bt=lerp(.18,.04,it.P*it.P)}
    if(it.P>=1)judge(it)}
   else{it.miss+=dt;if(it.miss>T.hold){it.P=Math.max(0,it.P-2.5*dt);if(!it.P)it.ct=0}
    if(it.miss>.12&&it.tried>0&&!it.near){it.near=true;if(it.P>=.6){trauma=Math.min(1,trauma+.15);sfx.pipi()}else if(it.tried>.25){combo=Math.max(0,combo-1);sfx.bu()}it.tried=0}}}
  else if(!it.held&&it.P>0)it.P=Math.max(0,it.P-2*dt)}}
function fx(dt){trauma=Math.max(0,trauma-1.6*dt);flash=Math.max(0,flash-dt/.2*.35);const r=spring(punch,punchV,0,300,.35,dt);punch=r[0];punchV=r[1];
 const b=spring(bagS,bagV,0,150,.35,dt);bagS=b[0];bagV=b[1];totBump=Math.max(0,totBump-dt*1.6);shown+=(total-shown)*(1-Math.exp(-12*dt));
 let tl=0;for(const it of items)if(it.held&&it.P>tl)tl=it.P;laser+=(tl-laser)*(1-Math.exp(-20*dt));
 if(label){label.t+=dt;if(label.t>.7)label=null}
 for(let i=0;i<128;i++){const o=i*7;if(P[o+4]>0){P[o+4]-=dt;P[o]+=P[o+2]*dt;P[o+1]+=P[o+3]*dt;P[o+3]+=300*dt;P[o+2]*=.97}}}
// ---- draw ----
function drawItem(it){const ty=it.ty,u=it.fly?Math.min(it.fly/.36,1):0,sc=(1+.12*it.h)*(1-.4*eOC(u)),sx=Math.max(Math.abs(Math.cos(Math.PI*it.fl)),.04),face=it.fl>.5?ty.bk:ty.fr,so=3+15*Math.min(it.h,1.3);
 ctx.save();ctx.translate(it.x+so*.8,it.y+so);ctx.rotate(it.a);ctx.scale(sc*sx,sc);ctx.globalAlpha=.6-.3*Math.min(it.h,1);dI(ty.sh);ctx.restore();
 ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.a);ctx.scale(sc*sx,sc);dI(face);
 if(it.fl>.5&&it.P>0){const b=ty.bc;ctx.fillStyle='rgba(255,255,255,'+(.15+it.P*.6)+')';ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h)}ctx.restore();

 if(it.sc&&!it.fly){ctx.strokeStyle='rgba(120,255,170,'+(.55+.3*Math.sin(clock*12))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(it.x,it.y,Math.max(ty.w,ty.h)/2*sc+4,0,7);ctx.stroke()}}
function draw(){const g=ctx;g.setTransform(R,0,0,R,0,0);g.drawImage(BG,0,0,W,H);
 // receipt strip (sways)
 const sw=Math.sin(clock*1.7)*3;g.fillStyle='#f4f3ee';g.beginPath();g.moveTo(24,101);g.lineTo(46,101);g.lineTo(46+sw,150);g.lineTo(24+sw*1.3,156);g.fill();g.fillStyle='#bbb';for(let i=0;i<4;i++)g.fillRect(28+sw*i*.2,108+i*9,12,1.5);
 // monitor HUD
 g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle='#8cc4ff';g.font='600 11px '+FONT;g.fillText('合計',38,30);
 g.save();g.translate(38,62);g.scale(1+totBump*.5,1+totBump*.5);g.fillStyle='#e8f6ff';g.font='700 34px '+MONO;g.fillText('¥'+Math.round(shown).toLocaleString(),0,0);g.restore();
 g.textAlign='right';g.fillStyle='#8cc4ff';g.font='600 11px '+FONT;g.fillText(count+' 点',326,30);if(combo>1){g.fillStyle='#ffd84a';g.font='700 15px '+MONO;g.fillText('COMBO '+combo,326,52);const f=clamp(1-(clock-lastScan)/3,0,1);g.fillRect(326-90*f,58,90*f,3)}g.textAlign='center';g.fillStyle=timeLeft<10?'#ff7a6a':'#e8f6ff';g.font='700 20px '+MONO;g.fillText(Math.ceil(Math.max(timeLeft,0))+'s',246,31);
 // bag
 g.save();g.translate(BAG.x,BAG.y+16);g.scale(1-bagS*.25,1+bagS*.5);g.fillStyle='rgba(235,240,245,.82)';g.beginPath();g.moveTo(-34,-30);g.lineTo(34,-30);g.lineTo(40,24);g.lineTo(-40,24);g.fill();g.strokeStyle='rgba(235,240,245,.8)';g.lineWidth=3;g.beginPath();g.arc(0,-30,12,Math.PI,0);g.stroke();g.restore();
 // items (held last)
 for(const it of items)drawItem(it);
 // laser
 const th=4+6*laser,hot=ss(.2,1,laser),col='rgb(255,'+((70+185*hot)|0)+','+((50+205*hot*hot)|0)+')';
 g.globalAlpha=.25+.3*laser;g.fillStyle=col;g.fillRect(18,LY-14-th,324,28+th*2);g.globalAlpha=1;g.fillStyle=col;g.fillRect(18,LY-th/2,324,th);
 for(let i=0;i<128;i++){const o=i*7;if(P[o+4]>0){g.globalAlpha=clamp(P[o+4]/P[o+5],0,1);g.fillStyle='#ffd37a';g.fillRect(P[o],P[o+1],P[o+6],P[o+6])}}g.globalAlpha=1;
 if(label){const u=label.t/.7,e=1+2.7*Math.pow(clamp(label.t/.18,0,1)-1,3)+1.7*Math.pow(clamp(label.t/.18,0,1)-1,2);g.save();g.translate(W/2,150-u*40);g.scale(.4+.6*e,.4+.6*e);g.globalAlpha=1-ss(.5,1,u);g.textAlign='center';g.textBaseline='middle';g.font='italic 800 36px '+FONT;g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(label.s,0,0);g.fillStyle=label.c;g.fillText(label.s,0,0);g.restore()}
 if(hint&&held&&held.sc){g.textAlign='center';g.font='600 13px '+FONT;g.fillStyle='#9dffb8';g.fillText('指を離すと袋へ',W/2,236)}
 if(flash>0){g.fillStyle='rgba(255,238,200,'+flash+')';g.fillRect(0,0,W,H)}
 g.drawImage(VIG,0,0,W,H);
 // camera: trauma shake + punch via CSS transform
 const k=trauma*trauma*RM,n=(s)=>(Math.sin(clock*13+s)+Math.sin(clock*23.7+s*2.1)*.5+Math.sin(clock*37.3+s*3.3)*.25)/1.75;
 cv.style.transform='translate('+(10*k*n(1)).toFixed(2)+'px,'+(10*k*n(7)).toFixed(2)+'px) rotate('+(.021*k*n(13)).toFixed(4)+'rad) scale('+(1+punch*RM).toFixed(4)+')'}
// ---- main loop (fixed 1/120 physics, hitstop/slow only affect gameplay time) ----
let last=0,acc=0,fps=60;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;clock+=dt;fps+=(1/Math.max(dt,.001)-fps)*.05;
 let ts=1;if(hs>0){hs-=dt;ts=0}else if(slowT>0){slowT-=dt;ts=lerp(.25,1,eIQ(clamp(1-slowT/slowD,0,1)))}

[['zone',5,30,1],['fall',30,80,1],['rate',3,25,.5],['hold',0,1,.05],['perfect',.1,.5,.01],['good',.2,1,.01],['offset',0,90,1]].forEach(([k,a,b,s])=>{
